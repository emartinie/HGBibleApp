<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4a5568">
  <title>HG Bible App — Offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #19243a, #06070b 56%);
      color: #eef3ff;
      font: 16px/1.6 system-ui, sans-serif;
    }
    main {
      width: min(100%, 34rem);
      padding: 28px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: rgba(14,18,28,.9);
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,.42);
    }
    img { width: 96px; height: auto; }
    h1 { margin: 14px 0 8px; color: #ffdf9c; }
    p { color: #b8c3d8; }
    button {
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid rgba(243,200,120,.45);
      border-radius: 999px;
      background: rgba(243,200,120,.12);
      color: #fff3cb;
      font: inherit;
      font-weight: 750;
    }
  </style>
</head>
<body>
  <main>
    <img src="./images/HGHouses.png" alt="">
    <h1>You are offline</h1>
    <p>The HG Bible App shell is available, but this location needs a connection the first time it is opened. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
