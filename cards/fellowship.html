<link rel="stylesheet" href="css/fellowship.css">
<section class="fellowship hg-panel" aria-labelledby="fellowshipTitle">
  <header><div><h2 id="fellowshipTitle">Fellowship</h2><p>Pray together. Find your community. Grow and serve together.</p></div>
  <div class="fellowship-actions"><button type="button" data-fellowship-action="study">Return to study</button><button type="button" data-fellowship-action="account">Account</button><button type="button" data-fellowship-action="people">Find people</button><button type="button" data-fellowship-action="profile">My profile</button></div></header>
  <nav class="fellowship-tabs" aria-label="Fellowship views">
    <button type="button" data-fellowship-view="prayer">Prayer Map</button><button type="button" data-fellowship-view="communities">My Communities</button><button type="button" data-fellowship-view="explore">Explore</button><button type="button" data-fellowship-view="messages">Messages</button>
  </nav>
  <p data-fellowship-account role="status"></p>
  <p data-fellowship-status role="status" aria-live="polite"></p>
  <button type="button" data-fellowship-action="retry" hidden>Try again</button>
  <div data-fellowship-content aria-busy="true"></div>
</section>
