<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeGroups Messages — Design Preview</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8edf5;background:#09111d}*{box-sizing:border-box}body{margin:0}.shell{max-width:1250px;margin:26px auto;border:1px solid #26354a;border-radius:20px;overflow:hidden;background:#111d2d;box-shadow:0 18px 60px #0006}.top{height:70px;display:flex;align-items:center;gap:15px;padding:0 24px;background:#15243a;border-bottom:1px solid #29384c}.logo{width:38px;height:38px;border-radius:12px;background:#d6b56a;color:#182233;display:grid;place-items:center;font-size:21px}.brand{font-weight:750;font-size:19px}.sub{font-size:12px;color:#a5b6c9}.tag{margin-left:auto;font-size:11px;color:#d6b56a;border:1px solid #6a5b3e;border-radius:30px;padding:6px 10px}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:660px}.sidebar{border-right:1px solid #29384c;background:#111c2b}.sidebar-head{padding:22px 18px 14px}.sidebar-head h2{margin:0 0 15px;font-size:21px}.search{background:#1c2b3e;border:1px solid #34445b;border-radius:12px;padding:12px;color:#b5c3d5;width:100%}.conversation{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:17px;border:0;border-bottom:1px solid #253247;background:transparent;color:inherit;cursor:pointer}.conversation:hover,.conversation.active{background:#22334a}.avatar{width:44px;height:44px;flex:none;border-radius:50%;background:#36566b;display:grid;place-items:center;color:#fff;font-weight:700}.who{font-weight:650}.preview{color:#a8b7c9;font-size:13px;margin-top:4px}.chat{display:flex;flex-direction:column;min-width:0}.chat-head{padding:17px 24px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #29384c}.chat-head .avatar{width:38px;height:38px}.status{font-size:12px;color:#83d3b1}.chat-body{flex:1;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;gap:15px;background:radial-gradient(circle at 75% 10%,#1c3045 0,transparent 55%)}.bubble{max-width:72%;border-radius:16px;padding:12px 16px;line-height:1.5;font-size:14px}.incoming{align-self:flex-start;background:#293c50;border-bottom-left-radius:5px}.outgoing{align-self:flex-end;background:#315f7a;border-bottom-right-radius:5px}.time{display:block;font-size:10px;opacity:.7;margin-top:5px}.composer{display:flex;gap:10px;padding:18px 24px;border-top:1px solid #29384c}.composer input{flex:1;min-width:0;background:#1c2b3e;border:1px solid #34445b;border-radius:12px;padding:14px;color:#fff}.composer button{background:#d6b56a;color:#182233;border:0;border-radius:12px;padding:0 20px;font-weight:700;cursor:pointer}.note{text-align:center;color:#9baec1;font-size:12px;margin:14px}.back{display:none;background:none;color:#e8edf5;border:0;font-size:22px;cursor:pointer}@media(max-width:680px){.shell{margin:0;border-radius:0;border:0}.layout{display:block;min-height:calc(100dvh - 70px)}.sidebar{min-height:calc(100dvh - 70px)}.chat{display:none;min-height:calc(100dvh - 70px)}.layout.open .sidebar{display:none}.layout.open .chat{display:flex}.back{display:block}.tag{font-size:10px}.bubble{max-width:88%}}
</style></head><body><main class="shell"><header class="top"><div class="logo">✦</div><div><div class="brand">HomeGroups Messages</div><div class="sub">Connect privately. Build community.</div></div><span class="tag">DESIGN PREVIEW</span></header><div class="layout" id="layout"><aside class="sidebar"><div class="sidebar-head"><h2>Messages</h2><input class="search" id="search" placeholder="Search conversations…" aria-label="Search conversations"></div><div id="list"></div></aside><section class="chat"><div class="chat-head"><button class="back" id="back" aria-label="Back to conversations">‹</button><div class="avatar" id="avatar">S</div><div><div class="who" id="name">Sarah</div><div class="status">Private conversation</div></div></div><div class="chat-body" id="messages"></div><form class="composer" id="composer"><input id="messageInput" placeholder="Write a message…" autocomplete="off" aria-label="Write a message"><button type="submit">Send ➤</button></form></section></div></main><p class="note">Interactive layout preview with fictional messages. No Firebase connection; nothing is sent or saved.</p><script>
const people=[{name:'Sarah',initial:'S',color:'#496a80',messages:[['in','Are we meeting for Bible study this week?'],['out','Yes! Thursday evening.'],['in','Sounds great! I will bring my notes.']]},{name:'Michael',initial:'M',color:'#665f86',messages:[['in','Thank you for sharing that passage.'],['out','Of course. Let me know what you discover.']]},{name:'Rebecca',initial:'R',color:'#537a6a',messages:[['out','See you Sunday!'],['in','Looking forward to it.']]}];let selected=0;const $=id=>document.getElementById(id);function render(){const p=people[selected];$('name').textContent=p.name;$('avatar').textContent=p.initial;$('avatar').style.background=p.color;$('list').replaceChildren(...people.filter(p=>p.name.toLowerCase().includes($('search').value.toLowerCase())).map(p=>{const i=people.indexOf(p),b=document.createElement('button');b.className='conversation'+(i===selected?' active':'');const a=document.createElement('div');a.className='avatar';a.style.background=p.color;a.textContent=p.initial;const d=document.createElement('div');const n=document.createElement('div');n.className='who';n.textContent=p.name;const v=document.createElement('div');v.className='preview';v.textContent=p.messages.at(-1)[1];d.append(n,v);b.append(a,d);b.onclick=()=>{selected=i;$('layout').classList.add('open');render()};return b}));$('messages').replaceChildren(...p.messages.map(([side,message])=>{const d=document.createElement('div');d.className='bubble '+(side==='in'?'incoming':'outgoing');d.textContent=message;return d}))}$('back').onclick=()=>$('layout').classList.remove('open');$('search').oninput=render;$('composer').onsubmit=e=>{e.preventDefault();const input=$('messageInput'),value=input.value.trim();if(!value)return;people[selected].messages.push(['out',value]);input.value='';render()};render();
</script></body></html>
