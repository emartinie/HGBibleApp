<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeGroups Direct Messages</title><style>body{font:16px system-ui;max-width:780px;margin:2rem auto;padding:1rem}section{border:1px solid #aaa;border-radius:10px;padding:1rem;margin:1rem 0}input,textarea{display:block;width:95%;padding:.6rem;margin:.5rem 0}button{padding:.6rem;margin:.3rem}article{border-top:1px solid #aaa;padding:.7rem 0;overflow-wrap:anywhere}</style></head><body><h1>HomeGroups Direct Messages</h1><p>Private to participants within the app. Stored in Firestore; not end-to-end encrypted. Privileged backend access may be used for legitimate legal or safety concerns.</p><p id="status">Checking sign-in…</p><section id="main" hidden><h2>Start a conversation</h2><label>Recipient Firebase UID<input id="recipient" maxlength="128"></label><button id="invite">Request conversation</button><h2>Inbox</h2><button id="refresh">Refresh</button><div id="inbox"></div></section><section id="thread" hidden><h2 id="heading"></h2><div id="actions"></div><div id="messages"></div><form id="compose" hidden><textarea id="body" maxlength="2000" required placeholder="Write a message"></textarea><button>Send</button></form></section><script type="module">
import {auth,db} from '../../../../../js/firebase-init.js';
import {onAuthStateChanged,onCommonsDispose} from '../commons-lifecycle.js';
import {collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,serverTimestamp,query,where,orderBy,limit} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {onSnapshot} from '../commons-lifecycle.js';
import {createDirectComposer} from '../direct-composer.js?v=20261104-privacy-1';
const el=id=>document.getElementById(id);
let user=null,current=null,epoch=0,threadVersion=0,stopInbox=null,stopConversation=null,stopMessages=null;
const notice=s=>el('status').textContent=s;

const composer = createDirectComposer({
 input: el('body'), form: el('compose'),
 send: async (uid, id, body) => {
  if (auth.currentUser?.uid !== uid) throw Error('Your account changed. Please reopen the conversation.');
  await addDoc(collection(db,'commonsDirectConversations',id,'messages'), {senderUid:uid,body,createdAt:serverTimestamp()});
 },
 onError: error => notice('Send failed: '+(error.code||error.message)),
 onSent: () => notice('Message sent.')
});

function action(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;return b;}
function stopThread(){threadVersion++;if(stopConversation){stopConversation();stopConversation=null;}if(stopMessages){stopMessages();stopMessages=null;}}
onCommonsDispose(()=>{
 epoch++;stopAll();user=null;current=null;composer.setAccount(null);composer.clear();
 document.getElementById('messages').replaceChildren();document.getElementById('actions').replaceChildren();
});
function stopAll(){stopThread();if(stopInbox){stopInbox();stopInbox=null;}}
onAuthStateChanged(auth,u=>{
  stopAll();composer.setAccount(u?.uid||null);composer.select(null);user=u;epoch++;current=null;el('actions').replaceChildren();el('heading').textContent='';
  el('thread').hidden=true;el('main').hidden=!u;el('inbox').replaceChildren();el('messages').replaceChildren();el('recipient').value='';el('invite').disabled=!u;
  notice(u?'Signed in: '+u.email:'Sign in through HomeGroups first.');
  if(u)inbox();
});
function inbox(){
  if(!user)return;
  if(stopInbox){stopInbox();stopInbox=null;}
  const uid=user.uid,token=epoch;
  el('inbox').textContent='Loading…';
  stopInbox=onSnapshot(query(collection(db,'commonsDirectConversations'),where('participants','array-contains',uid),limit(50)),snap=>{
    if(token!==epoch||auth.currentUser?.uid!==uid)return;
    el('inbox').replaceChildren();
    if(snap.empty)el('inbox').textContent='No conversations yet.';
    snap.forEach(d=>{
      const c=d.data(),a=document.createElement('article');
      a.append(document.createTextNode(c.participants.find(x=>x!==uid)+' — '+c.status+' '),action('Open',()=>open(d.id)));
      el('inbox').append(a);
    });
  },e=>{if(token===epoch)notice('Inbox: '+(e.code||e.message));});
}
el('refresh').onclick=inbox;
el('invite').onclick=async()=>{
 if(!user||auth.currentUser?.uid!==user.uid)return;
 const other=el('recipient').value.trim(),uid=user.uid,token=epoch;
 if(!/^[A-Za-z0-9]{15,128}$/.test(other)||other===uid){notice('Enter another member’s Firebase UID.');return;}
 const participants=[uid,other].sort(),id=participants.join('_');
 const active=()=>token===epoch&&auth.currentUser?.uid===uid;
 el('invite').disabled=true;
 try{await setDoc(doc(db,'commonsDirectConversations',id),{participants,requestedBy:uid,status:'pending',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});if(active())notice('Invitation sent. Inbox updates automatically.');}
 catch(error){if(active())notice('Invitation failed: '+(error.code||error.message));}
 finally{if(active())el('invite').disabled=false;}
};
function open(id){
 if(!user||auth.currentUser?.uid!==user.uid)return;
 stopThread();composer.select(id);current=id;
 const token=epoch,uid=user.uid,view=threadVersion,ref=doc(db,'commonsDirectConversations',id);
 const active=()=>token===epoch&&current===id&&view===threadVersion&&auth.currentUser?.uid===uid;
 el('thread').hidden=false;
 const messages=el('messages'),actions=el('actions');
 messages.textContent='Loading…';actions.replaceChildren();composer.setAccepted(false);
 stopConversation=onSnapshot(ref,snap=>{
  if(!active())return;
  const c=snap.data();
  if(!c||!Array.isArray(c.participants)||!c.participants.includes(uid)){
   notice('Conversation unavailable.');messages.replaceChildren();actions.replaceChildren();composer.select(null);stopThread();return;
  }
  actions.replaceChildren();
  el('heading').textContent='Conversation with '+c.participants.find(x=>x!==uid)+' ('+c.status+')';
  if(c.status==='pending'&&c.requestedBy!==uid){
   let responding=false;
   for(const [label,status] of [['Accept','accepted'],['Decline','declined']]){
    const button=document.createElement('button');button.textContent=label;
    button.onclick=async()=>{
     if(!active()||responding)return;
     responding=true;button.disabled=true;
     try{await updateDoc(ref,{status,updatedAt:serverTimestamp()});if(active())notice(status==='accepted'?'Invitation accepted.':'Invitation declined.');}
     catch(error){if(active())notice('Response failed: '+(error.code||error.message));}
     finally{responding=false;if(active())button.disabled=false;}
    };
    actions.append(button);
   }
  }
  composer.setAccepted(c.status==='accepted');
  if(c.status==='accepted'){
   if(!stopMessages)stopMessages=onSnapshot(query(collection(ref,'messages'),orderBy('createdAt','asc'),limit(100)),snapshot=>{
    if(!active())return;
    messages.replaceChildren();
    if(snapshot.empty){const empty=document.createElement('p');empty.className='empty';empty.textContent='No messages yet.';messages.append(empty);}

    snapshot.forEach(message=>{
     const data=message.data();
     const article=document.createElement('article'),body=document.createElement('p');
     article.textContent=(data.senderUid===uid?'You':data.senderUid)+' · '+(data.createdAt?.toDate?.().toLocaleString()||'Just now');body.textContent=data.body;article.append(body);messages.append(article);
    });

   },error=>{if(active())notice('Messages: '+(error.code||error.message));});
  }else{
   stopMessages?.();stopMessages=null;
   messages.textContent=c.status==='pending'?(c.requestedBy===uid?'Waiting for the other member to accept.':'Accept the invitation to start messaging.'):'This invitation was declined.';
  }
 },error=>{if(active()){composer.setAccepted(false);notice('Conversation: '+(error.code||error.message));}});
}
</script></body></html>
