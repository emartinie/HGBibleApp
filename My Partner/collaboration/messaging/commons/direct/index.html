<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeGroups Direct Messages</title><style>body{font:16px system-ui;max-width:780px;margin:2rem auto;padding:1rem}section{border:1px solid #aaa;border-radius:10px;padding:1rem;margin:1rem 0}input,textarea{display:block;width:95%;padding:.6rem;margin:.5rem 0}button{padding:.6rem;margin:.3rem}article{border-top:1px solid #aaa;padding:.7rem 0;overflow-wrap:anywhere}</style></head><body><h1>HomeGroups Direct Messages</h1><p>Private to participants within the app. Stored in Firestore; not end-to-end encrypted. Privileged backend access may be used for legitimate legal or safety concerns.</p><p id="status">Checking sign-in…</p><section id="main" hidden><h2>Start a conversation</h2><label>Recipient Firebase UID<input id="recipient" maxlength="128"></label><button id="invite">Request conversation</button><h2>Inbox</h2><button id="refresh">Refresh</button><div id="inbox"></div></section><section id="thread" hidden><h2 id="heading"></h2><div id="actions"></div><div id="messages"></div><form id="compose" hidden><textarea id="body" maxlength="2000" required placeholder="Write a message"></textarea><button>Send</button></form></section><script type="module">
import {auth,db} from '../../../../js/firebase-init.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,serverTimestamp,query,where,orderBy,limit} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const el=id=>document.getElementById(id);let user=null,current=null,epoch=0;const notice=s=>el('status').textContent=s;
function action(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=fn;return b;}
onAuthStateChanged(auth,u=>{user=u;epoch++;current=null;el('thread').hidden=true;el('main').hidden=!u;notice(u?'Signed in: '+u.email:'Sign in through HomeGroups first.');if(u)inbox();});
async function inbox(){if(!user)return;const uid=user.uid,token=epoch;el('inbox').textContent='Loading…';try{const docs=await getDocs(query(collection(db,'commonsDirectConversations'),where('participants','array-contains',uid),limit(50)));if(token!==epoch)return;el('inbox').replaceChildren();if(docs.empty)el('inbox').textContent='No conversations yet.';docs.forEach(d=>{const c=d.data(),a=document.createElement('article');a.append(document.createTextNode(c.participants.find(x=>x!==uid)+' — '+c.status+' '),action('Open',()=>open(d.id)));el('inbox').append(a);});}catch(e){notice('Inbox: '+(e.code||e.message));}}
el('refresh').onclick=inbox;
el('invite').onclick=async()=>{if(!user)return;const other=el('recipient').value.trim(),uid=user.uid;if(!/^[A-Za-z0-9]{15,128}$/.test(other)||other===uid){notice('Enter another member’s Firebase UID.');return;}const participants=[uid,other].sort(),id=participants.join('_');try{const ref=doc(db,'commonsDirectConversations',id);if((await getDoc(ref)).exists()){notice('Conversation request already exists.');return;}await setDoc(ref,{participants,requestedBy:uid,status:'pending',createdAt:serverTimestamp(),updatedAt:serverTimestamp()});notice('Invitation sent.');await inbox();}catch(e){notice('Invitation failed: '+(e.code||e.message));}};
async function open(id){if(!user)return;current=id;const token=epoch,uid=user.uid;el('thread').hidden=false;el('actions').replaceChildren();el('messages').replaceChildren();el('compose').hidden=true;try{const ref=doc(db,'commonsDirectConversations',id),snap=await getDoc(ref);if(token!==epoch||current!==id)return;const c=snap.data();if(!c||!c.participants.includes(uid))throw Error('Conversation unavailable');el('heading').textContent='Conversation with '+c.participants.find(x=>x!==uid)+' ('+c.status+')';if(c.status==='pending'&&c.requestedBy!==uid){for(const state of ['accepted','declined'])el('actions').append(action(state==='accepted'?'Accept':'Decline',async()=>{try{await updateDoc(ref,{status:state,updatedAt:serverTimestamp()});await inbox();await open(id);}catch(e){notice(e.code||e.message);}}));}if(c.status==='accepted'){el('compose').hidden=false;const messages=await getDocs(query(collection(ref,'messages'),orderBy('createdAt','asc'),limit(100)));if(token!==epoch||current!==id)return;messages.forEach(m=>{const d=m.data(),a=document.createElement('article'),p=document.createElement('p');a.textContent=(d.senderUid===uid?'You':d.senderUid)+' · '+(d.createdAt?.toDate?.().toLocaleString()||'Just now');p.textContent=d.body;a.append(p);el('messages').append(a);});}else el('messages').textContent=c.status==='pending'?'Awaiting acceptance.':'Request declined.';}catch(e){notice('Conversation: '+(e.code||e.message));}}
el('compose').onsubmit=async e=>{e.preventDefault();if(!user||!current)return;const body=el('body').value.trim();if(!body)return;try{await addDoc(collection(db,'commonsDirectConversations',current,'messages'),{senderUid:user.uid,body,createdAt:serverTimestamp()});el('body').value='';await open(current);}catch(e){notice('Send failed: '+(e.code||e.message));}};
</script></body></html>
